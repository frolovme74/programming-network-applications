<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Workshop</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto;">
        <div class="main-header-area">
            <h1 class="steam-title">Мастерская 3D Моделей</h1>
            <div class="steam-tabs">
                <span class="active-tab">Ваши модели</span>
                <span>Подписки (Базовые)</span>
                <span id="upload-btn" style="margin-left: auto; color: #67c1f5;">+ Загрузить .glb</span>
                <input type="file" id="upload-input" accept=".glb" style="display: none;">
            </div>
        </div>

        <div id="main-page" style="display: flex; flex-wrap: wrap;">
            </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
